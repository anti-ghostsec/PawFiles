# Run by hand: installs a release of Files on an Android emulator and keeps
# screenshots of it in light and dark mode, and whatever it logged.
name: UI check

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to check (empty: the latest)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  ui-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Get the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -eu
          if [ -n "$RELEASE" ]; then
            gh release download "$RELEASE" -R "$GITHUB_REPOSITORY" -p 'files-android.apk*'
          else
            gh release download -R "$GITHUB_REPOSITORY" -p 'files-android.apk*'
          fi
          sha256sum -c files-android.apk.sha256

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: sh tools/ui-check.sh files-android.apk ui-check

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-check
          path: ui-check
          retention-days: 7

apply plugin: 'com.android.application'
apply plugin: 'kotlin-parcelize'


android {
    namespace 'me.zhanghai.android.files'
    buildToolsVersion = '37.0.0'
    compileSdk = 37
    compileSdkMinor = 2
    ndkVersion '30.0.16248370'
    defaultConfig {
        applicationId 'io.github.files.app'
        minSdk 23
        // Not supporting the ACCESS_LOCAL_NETWORK runtime permission yet.
        //noinspection OldTargetApi
        targetSdk 36
        // Each build must count higher than the one it updates: the release
        // workflow passes the number of commits (-PversionCode=...).
        versionCode((findProperty('versionCode') ?: '1') as Integer)
        versionName((findProperty('versionName') ?: '0.1.0') as String)
        resValue 'string', 'app_version', versionName + ' (' + versionCode + ')'
        buildConfigField 'String', 'FILE_PROVIDIER_AUTHORITY', 'APPLICATION_ID + ".file_provider"'
        resValue 'string', 'app_provider_authority', applicationId + '.app_provider'
        resValue 'string', 'file_provider_authority', applicationId + '.file_provider'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
            }
        }
    }
    buildFeatures {
        aidl true
        buildConfig true
        resValues true
        viewBinding true
    }
    androidResources {
        generateLocaleConfig true
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
        }
    }
    lint {
        // For "Invalid package reference in library; not included in Android: javax.security.sasl.
        // Referenced from org.apache.mina.proxy.ProxyAuthException."
        warning 'InvalidPackage', 'MissingTranslation'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                    // https://github.com/kotlin/kotlinx.coroutines#avoiding-including-the-debug-infrastructure-in-the-resulting-apk
                    '/DebugProbesKt.bin',
                    '/META-INF/DEPENDENCIES',
            ]
        }
    }
    bundle {
        language {
            enableSplit = false
        }
    }
}

repositories {
    maven {
        url 'https://jitpack.io'
    }
}
dependencies {
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'com.github.topjohnwu.libsu:service:5.2.2'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")

    // kotlinx-coroutines-android depends on kotlin-stdlib-jdk8
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    def kotlinx_coroutines_version = '1.11.0'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinx_coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlinx_coroutines_version"

    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.fragment:fragment-ktx:1.9.1'
    def androidx_lifecycle_version = '2.11.0'
    implementation "androidx.lifecycle:lifecycle-common-java8:$androidx_lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$androidx_lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-process:$androidx_lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$androidx_lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$androidx_lifecycle_version"
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'com.google.android.material:material:1.14.0'

    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view-androidx:3.10.0'
    implementation 'com.drakeet.drawer:drawer:1.0.3'
    implementation 'com.h6ah4i.android.materialshadowninepatch:materialshadowninepatch:1.0.0'
    implementation 'com.h6ah4i.android.widget.advrecyclerview:advrecyclerview:1.0.0'
    implementation 'com.leinardi.android:speed-dial:3.3.0'
    implementation 'com.takisoft.preferencex:preferencex:1.1.0'
    // LicensesDialog 2.2.0 pulls in androidx.webkit and uses setForceDark() instead of correctly
    // setting colors.
    //noinspection NewerVersionAvailable
    implementation 'de.psdev.licensesdialog:licensesdialog:2.1.0'
    // dev.chrisbanesinsetter:insetter:0.6.0 makes inset unstable when entering immersive.
    implementation 'dev.chrisbanes:insetter-ktx:0.3.1'
    implementation 'dev.rikka.rikkax.preference:simplemenu-preference:1.0.3'
    def shizuku_version = '13.1.5'
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"
    // Coil 3, which (unlike Coil 2) has no network code unless it's added.
    implementation platform('io.coil-kt.coil3:coil-bom:3.6.3')
    implementation 'io.coil-kt.coil3:coil'
    implementation 'io.coil-kt.coil3:coil-gif'
    implementation 'io.coil-kt.coil3:coil-svg'
    implementation 'me.zhanghai.android.appiconloader:appiconloader:1.5.0'
    implementation 'me.zhanghai.android.fastscroll:library:1.3.0'
    implementation 'me.zhanghai.android.foregroundcompat:library:1.0.2'
    implementation 'me.zhanghai.android.libarchive:library:1.1.7'
    implementation 'me.zhanghai.android.libselinux:library:2.1.1'
    implementation 'me.zhanghai.android.retrofile:library:1.2.0'
    implementation 'me.zhanghai.android.systemuihelper:library:1.0.0'
}

// No logs from native code either. libarchive-jni and libselinux-jni come
// built, linked to Android's log (liblog.so). After they're stripped, and
// before they go into the APK, each one's link to liblog.so becomes a link
// to libnlg.so (the same length), which the app builds from
// src/main/jni/nlg.c: the same functions, doing nothing. The name is in
// the library just once, as a string in its dynamic section, or the build
// fails here; tools/log-audit.sh checks the result in every release.
def silenceNativeLogs(File so) {
    byte[] bytes = so.bytes
    String text = new String(bytes, 'ISO-8859-1')
    String from = 'liblog.so\u0000'
    String to = 'libnlg.so\u0000'
    int at = text.indexOf(from)
    if (at < 0) {
        return
    }
    if (text.indexOf(from, at + 1) >= 0 || at == 0 || text.charAt(at - 1) != '\u0000' as char) {
        throw new GradleException("silenceNativeLogs: can't safely relink ${so.name} away from liblog.so")
    }
    System.arraycopy(to.getBytes('ISO-8859-1'), 0, bytes, at, to.length())
    so.bytes = bytes
}

tasks.configureEach { task ->
    if (task.name ==~ /strip\w*DebugSymbols/) {
        task.doLast {
            task.outputs.files.files.each { out ->
                if (out.isDirectory()) {
                    out.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                        if (f.name.endsWith('.so')) {
                            silenceNativeLogs(f)
                        }
                    }
                }
            }
        }
    }
}
